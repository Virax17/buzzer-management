<header class="top-bar">
  <a class="brand" routerLink="/overview" [attr.aria-label]="data.appName">
    <svg class="logo" viewBox="0 0 33 34" aria-hidden="true" focusable="false">
      <path
        class="logo-body"
        d="M30.2548 13.8562C28.9818 15.2156 27.4594 16.1218 25.6801 16.5712C27.3291 16.9869 28.5947 17.7808 29.4657 18.9492C30.3404 20.1176 30.7759 21.4883 30.7759 23.0536C30.7759 23.5667 30.7275 24.1097 30.6345 24.6864C30.1245 27.6636 28.751 29.963 26.5139 31.577C24.2768 33.1948 21.3287 34 17.6772 34H0L5.95567 0H23.1564C26.2049 0 28.5798 0.599185 30.2809 1.8013C31.9782 3.00341 32.8306 4.75603 32.8306 7.05915C32.8306 7.6059 32.7822 8.19385 32.6892 8.83798C32.3393 10.8228 31.5316 12.4968 30.2585 13.8562H30.2548Z"
      />
      <path
        class="logo-bolt"
        d="M12.8382 27.3228L14.2638 18.9567H7.61206L17.2975 6.7558L15.8942 15.0208H22.4752L12.8419 27.3228H12.8382Z"
      />
    </svg>
    <span class="brand-name">{{ data.appName }}</span>
  </a>

  <nav class="nav" aria-label="Main">
    @for (item of data.nav; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{
        item.label
      }}</a>
    }
  </nav>

  <div class="actions">
    <button type="button" class="date" [attr.aria-label]="'Date range: ' + data.dateRange">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <path d="M16 2v4M8 2v4M3 10h18" />
      </svg>
      <span class="date-label">{{ data.dateRange }}</span>
      <svg class="icon small" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>

    <button
      type="button"
      class="icon-btn"
      [attr.aria-label]="'Notifications, ' + data.unreadNotifications + ' unread'"
    >
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" />
      </svg>
      @if (data.unreadNotifications > 0) {
        <span class="dot" aria-hidden="true"></span>
      }
    </button>

    <div class="settings">
      <button
        type="button"
        class="icon-btn"
        aria-label="Settings"
        aria-haspopup="true"
        aria-controls="settings-menu"
        [attr.aria-expanded]="settingsOpen()"
        (click)="settingsOpen.set(!settingsOpen())"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      @if (settingsOpen()) {
        <div id="settings-menu" class="menu" role="group" aria-label="Appearance">
          <p class="menu-title">Appearance</p>
          @for (option of themeOptions; track option.id) {
            <button
              type="button"
              class="option"
              [attr.aria-pressed]="theme.choice() === option.id"
              (click)="choose(option.id)"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                @switch (option.id) {
                  @case ('light') {
                    <circle cx="12" cy="12" r="4" />
                    <path
                      d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                    />
                  }
                  @case ('dark') {
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                  }
                  @default {
                    <rect x="2" y="3" width="20" height="14" rx="2" />
                    <path d="M8 21h8M12 17v4" />
                  }
                }
              </svg>
              {{ option.label }}
            </button>
          }
        </div>
      }
    </div>

    <button type="button" class="user" [attr.aria-label]="'Account menu for ' + data.userName">
      <span class="avatar" aria-hidden="true">{{ initials }}</span>
      <svg class="icon small" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
  </div>
</header>
